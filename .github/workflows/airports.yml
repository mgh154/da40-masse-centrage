name: Mise à jour des aérodromes

on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  airports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruire airports.json depuis OurAirports
        run: python tools/build_airports.py
      - name: Enregistrer si le fichier a changé
        run: |
          git config user.name "airports-bot"
          git config user.email "airports-bot@users.noreply.github.com"
          git add airports.json
          git diff --cached --quiet || (git commit -m "Mise à jour des aérodromes (OurAirports)" && git push)
